<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 520" role="img" aria-labelledby="title desc">
  <title id="title">SIUShah — Python systems and automation</title>
  <desc id="desc">A dark futuristic grid with animated cyan and violet orbital lines behind the SIUShah heading.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050816"/>
      <stop offset="0.55" stop-color="#0b1026"/>
      <stop offset="1" stop-color="#170b2d"/>
    </linearGradient>
    <radialGradient id="glowCyan"><stop offset="0" stop-color="#22d3ee" stop-opacity=".34"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowViolet"><stop offset="0" stop-color="#a78bfa" stop-opacity=".30"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#5eead4" stroke-opacity=".10" stroke-width="1"/>
      <circle cx="1" cy="1" r="1.3" fill="#67e8f9" fill-opacity=".24"/>
    </pattern>
    <filter id="blur"><feGaussianBlur stdDeviation="20"/></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="5"/></filter>
    <linearGradient id="line" x1="0" x2="1"><stop stop-color="#22d3ee" stop-opacity="0"/><stop offset=".5" stop-color="#67e8f9"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></linearGradient>
  </defs>
  <rect width="1600" height="520" rx="28" fill="url(#bg)"/>
  <circle cx="260" cy="120" r="260" fill="url(#glowCyan)" filter="url(#blur)">
    <animate attributeName="cx" values="260;420;260" dur="12s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="120;220;120" dur="10s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1330" cy="410" r="300" fill="url(#glowViolet)" filter="url(#blur)">
    <animate attributeName="cx" values="1330;1160;1330" dur="14s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="410;300;410" dur="11s" repeatCount="indefinite"/>
  </circle>
  <rect x="28" y="28" width="1544" height="464" rx="20" fill="url(#grid)"/>
  <g fill="none" stroke="url(#line)" stroke-width="2" opacity=".72">
    <path d="M-80 382 C250 90 470 90 810 300 S1320 520 1680 120">
      <animate attributeName="d" dur="9s" repeatCount="indefinite" values="M-80 382 C250 90 470 90 810 300 S1320 520 1680 120;M-80 320 C260 160 500 40 820 330 S1320 440 1680 180;M-80 382 C250 90 470 90 810 300 S1320 520 1680 120"/>
    </path>
    <path d="M-100 440 C300 160 470 160 760 350 S1300 480 1700 80" opacity=".35"/>
    <ellipse cx="800" cy="260" rx="630" ry="170" stroke="#67e8f9" stroke-opacity=".20" transform="rotate(-12 800 260)"/>
    <ellipse cx="800" cy="260" rx="560" ry="125" stroke="#a78bfa" stroke-opacity=".18" transform="rotate(16 800 260)"/>
  </g>
  <g fill="#67e8f9">
    <circle cx="250" cy="190" r="3"><animate attributeName="opacity" values=".2;1;.2" dur="2.1s" repeatCount="indefinite"/></circle>
    <circle cx="1330" cy="150" r="2"><animate attributeName="opacity" values="1;.2;1" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="1120" cy="410" r="3"><animate attributeName="opacity" values=".2;1;.2" dur="2.7s" repeatCount="indefinite"/></circle>
    <circle cx="430" cy="390" r="2"><animate attributeName="opacity" values="1;.2;1" dur="3.1s" repeatCount="indefinite"/></circle>
  </g>
  <rect x="80" y="78" width="1440" height="1" fill="url(#line)" opacity=".7">
    <animate attributeName="y" values="78;442;78" dur="8s" repeatCount="indefinite"/>
  </rect>
  <g font-family="Arial, DejaVu Sans, sans-serif" text-anchor="middle">
    <text x="800" y="105" fill="#f8fafc" font-size="82" font-weight="700" letter-spacing="9">SIUShah
      <animate attributeName="opacity" values=".88;1;.88" dur="4.8s" repeatCount="indefinite"/>
      <animate attributeName="letter-spacing" values="9;12;9" dur="6s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="rotate" values="0 800 260;360 800 260" dur="18s" repeatCount="indefinite"/>
    </text>
    <g fill="#a5f3fc" font-size="22" letter-spacing="4">
      <text x="800" y="302" text-anchor="middle" opacity="1">FFMPEG · PYSIDE6 · AI · WINDOWS
        <animate attributeName="opacity" dur="20s" repeatCount="indefinite" values="1;1;0;0;0;0;0;0" keyTimes="0;.16;.2;.25;.45;.5;.7;1"/>
      </text>
      <text x="800" y="302" text-anchor="middle" opacity="0">PYTHON · SYSTEMS · AUTOMATION
        <animate attributeName="opacity" dur="20s" repeatCount="indefinite" values="0;0;1;1;0;0;0;0" keyTimes="0;.16;.2;.36;.4;.5;.7;1"/>
      </text>
      <text x="800" y="302" text-anchor="middle" opacity="0">MULTITRACK MEDIA · KEYFRAMES · AUDIO
        <animate attributeName="opacity" dur="20s" repeatCount="indefinite" values="0;0;0;0;1;1;0;0" keyTimes="0;.16;.2;.36;.4;.66;.7;1"/>
      </text>
      <text x="800" y="302" text-anchor="middle" opacity="0">ARCHITECTURE · TESTING · DELIVERY
        <animate attributeName="opacity" dur="20s" repeatCount="indefinite" values="0;0;0;0;0;0;1;1" keyTimes="0;.16;.2;.36;.4;.66;.7;1"/>
      </text>
    </g>
    <text x="800" y="354" fill="#c4b5fd" font-size="17" letter-spacing="2">BUILDING PRACTICAL SOFTWARE WITH EVIDENCE
      <animate attributeName="opacity" values=".55;.9;.55" dur="6.5s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 1;0 0" dur="8s" repeatCount="indefinite"/>
    </text>
  </g>
  <rect x="28" y="28" width="1544" height="464" rx="20" fill="none" stroke="#67e8f9" stroke-opacity=".22"/>
</svg>
