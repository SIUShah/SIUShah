<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 220" role="img" aria-labelledby="title desc">
  <title id="title">Animated AI systems architecture field</title>
  <desc id="desc">A subtle animated cyan and violet systems field with a grid, data nodes, and moving signal paths.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#050816"/>
      <stop offset="0.5" stop-color="#0b1026"/>
      <stop offset="1" stop-color="#160b2d"/>
    </linearGradient>
    <linearGradient id="signal" x1="0" x2="1">
      <stop stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset=".5" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="cyan"><stop stop-color="#22d3ee" stop-opacity=".25"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
    <radialGradient id="violet"><stop stop-color="#a78bfa" stop-opacity=".24"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#67e8f9" stroke-opacity=".10"/>
      <circle cx="1" cy="1" r="1" fill="#67e8f9" fill-opacity=".26"/>
    </pattern>
    <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="glow"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>
  <rect width="1600" height="220" rx="22" fill="url(#bg)"/>
  <circle cx="240" cy="110" r="220" fill="url(#cyan)" filter="url(#blur)">
    <animate attributeName="cx" values="240;470;240" dur="13s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="110;55;110" dur="9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1370" cy="125" r="250" fill="url(#violet)" filter="url(#blur)">
    <animate attributeName="cx" values="1370;1160;1370" dur="15s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="125;180;125" dur="11s" repeatCount="indefinite"/>
  </circle>
  <rect x="16" y="16" width="1568" height="188" rx="16" fill="url(#grid)"/>
  <g fill="none" stroke="url(#signal)" stroke-width="2" opacity=".75">
    <path d="M-40 158 C210 20 330 38 520 128 S900 224 1110 88 S1390 18 1640 108">
      <animate attributeName="d" dur="10s" repeatCount="indefinite" values="M-40 158 C210 20 330 38 520 128 S900 224 1110 88 S1390 18 1640 108;M-40 130 C200 72 350 8 550 145 S930 205 1130 70 S1410 55 1640 135;M-40 158 C210 20 330 38 520 128 S900 224 1110 88 S1390 18 1640 108"/>
    </path>
    <path d="M-20 188 C260 65 380 62 610 154 S930 232 1190 116 S1420 62 1620 142" opacity=".35"/>
    <path d="M0 62 H1600" stroke="#67e8f9" stroke-opacity=".13"/>
  </g>
  <g fill="#67e8f9">
    <circle cx="220" cy="94" r="3"><animate attributeName="opacity" values=".2;1;.2" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="575" cy="145" r="2"><animate attributeName="opacity" values="1;.2;1" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="1040" cy="104" r="3"><animate attributeName="opacity" values=".2;1;.2" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="1390" cy="150" r="2"><animate attributeName="opacity" values="1;.2;1" dur="3.7s" repeatCount="indefinite"/></circle>
  </g>
  <g fill="none" stroke="#a5f3fc" stroke-opacity=".18">
    <ellipse cx="800" cy="112" rx="560" ry="76" transform="rotate(-8 800 112)"/>
    <ellipse cx="800" cy="112" rx="430" ry="52" transform="rotate(12 800 112)"/>
  </g>
  <rect x="16" y="16" width="1568" height="188" rx="16" fill="none" stroke="#67e8f9" stroke-opacity=".22"/>
  <rect x="38" y="34" width="1524" height="1" fill="url(#signal)">
    <animate attributeName="y" values="34;185;34" dur="8s" repeatCount="indefinite"/>
  </rect>
</svg>
